spring:
  application:
    name: auth-service
  datasource:
    url: ${VELLUM_AUTH_DB_URL:jdbc:postgresql://127.0.0.1:5433/vellum_auth}
    username: ${VELLUM_AUTH_DB_USERNAME:vellum_auth}
    password: ${VELLUM_AUTH_DB_PASSWORD:}
  flyway:
    enabled: true
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
  security:
    user:
      name: unused
      password: ${VELLUM_UNUSED_BOOT_USER_PASSWORD:unused}
server:
  port: 9000
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
management:
  server:
    port: ${VELLUM_AUTH_MANAGEMENT_PORT:9001}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
vellum:
  auth:
    issuer: ${VELLUM_AUTH_ISSUER:}
    api-audience: ${VELLUM_AUTH_API_AUDIENCE:api://vellumhub}
    keys:
      private-key-path: ${VELLUM_AUTH_PRIVATE_KEY_PATH:}
      public-key-path: ${VELLUM_AUTH_PUBLIC_KEY_PATH:}
      kid: ${VELLUM_AUTH_ACTIVE_KID:}
    password:
      argon2:
        memory-kib: ${VELLUM_AUTH_ARGON2_MEMORY_KIB:19456}
        iterations: ${VELLUM_AUTH_ARGON2_ITERATIONS:2}
        parallelism: ${VELLUM_AUTH_ARGON2_PARALLELISM:1}
  poc:
    origin: ${VELLUM_POC_SPA_ORIGIN:}
    client-id: vellumhub-spa-poc
    redirect-uri: ${VELLUM_POC_REDIRECT_URI:}
    post-logout-uri: ${VELLUM_POC_LOGOUT_URI:}
    fixture:
      enabled: false
      login: ${VELLUM_POC_LOGIN:}
      password: ${VELLUM_POC_PASSWORD:}

  session:
    absolute-seconds: ${VELLUM_AUTH_SESSION_ABSOLUTE_SECONDS:43200}
  identity:
    registration-enabled: ${VELLUM_IDENTITY_REGISTRATION_ENABLED:false}
    shared-secret: ${VELLUM_INTERNAL_PROVISION_KEY:}
    user-service-url: ${VELLUM_IDENTITY_USER_URL:}
    reconcile-delay-ms: ${VELLUM_IDENTITY_RECONCILE_DELAY_MS:30000}
