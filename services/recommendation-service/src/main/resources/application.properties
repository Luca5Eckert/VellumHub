spring.application.name=recommendation-service

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}


server.port=${SERVER_PORT:8080}

feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000
catalog-service.ribbon.listOfServers=http://catalog-service:8080

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.health.kafka.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.service=${spring.application.name}

logging.structured.format.console=logstash
logging.structured.json.add.service=${spring.application.name}
logging.structured.json.add.environment=${VELLUM_ENVIRONMENT:local}
logging.structured.json.rename.logger_name=logger

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

spring.kafka.consumer.group-id=recommendation-group
spring.kafka.consumer.auto-offset-reset=earliest

# Keep pre-cutover listeners available until producers and their topics are drained.
# Set false only after completing the coordinated migration to versioned Outbox streams.
app.kafka.legacy-consumers.enabled=${KAFKA_LEGACY_CONSUMERS_ENABLED:true}

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.type.mapping=\
  rating_baseline_event:com.vellumhub.kafka.contracts.engagement.RatingBaselineEvent,\
  reaction_baseline_event:com.vellumhub.kafka.contracts.engagement.ReactionBaselineEvent,\
  rating_created_event:com.vellumhub.kafka.contracts.engagement.RatingCreatedEvent,\
  rating_updated_event:com.vellumhub.kafka.contracts.engagement.RatingUpdatedEvent,\
  rating_deleted_event:com.vellumhub.kafka.contracts.engagement.RatingDeletedEvent,\
  create_book_event:com.vellumhub.kafka.contracts.book.CreateBookEvent, \
  book_changed_event:com.vellumhub.kafka.contracts.book.BookChangedEvent,\
  update_book_event:com.vellumhub.kafka.contracts.book.UpdateBookEvent,\
  delete_book_event:com.vellumhub.kafka.contracts.book.DeleteBookEvent,\
  create_rating_event:com.vellumhub.kafka.contracts.engagement.CreatedRatingEvent, \
  update_rating_event:com.vellumhub.kafka.contracts.engagement.UpdatedRatingEvent, \
  update_book_progress_event:com.vellumhub.kafka.contracts.readingprogress.UpdateBookProgressEvent, \
  create_book_progress_event:com.vellumhub.kafka.contracts.readingprogress.CreateBookProgressEvent, \
  reading_progress_changed_event:com.vellumhub.kafka.contracts.readingprogress.ReadingProgressChangedEvent, \
  reaction_changed_event:com.vellumhub.kafka.contracts.engagement.ReactionChangedEvent, \
  created_user_preference:com.vellumhub.kafka.contracts.user.CreateUserPreferenceEvent

spring.kafka.consumer.properties.spring.json.trusted.packages=*

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:30s}
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=*





# Ordered consumer recovery: 1 initial attempt + 3 retries by default.
app.kafka.recovery.backoff-ms=${KAFKA_RECOVERY_BACKOFF_MS:1000}
app.kafka.recovery.max-retries=${KAFKA_RECOVERY_MAX_RETRIES:3}

# RS256 public verification key (X.509 PEM); fail startup when missing.
jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION:}


# Buckets used by HTTP p95/p99 dashboards and latency alerts.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.vellumhub.recommendation.generation.duration=true
