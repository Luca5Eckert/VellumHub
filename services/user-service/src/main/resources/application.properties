spring.application.name=user-service

server.port=

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

google.client.id=${GOOGLE_CLIENT_ID:}


management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.health.kafka.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.service=${spring.application.name}

logging.structured.format.console=logstash
logging.structured.json.add.service=${spring.application.name}
logging.structured.json.add.environment=${VELLUM_ENVIRONMENT:local}
logging.structured.json.rename.logger_name=logger

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.trusted.packages=*

spring.kafka.producer.properties.spring.json.type.mapping =\
  created_user_preference:com.vellumhub.kafka.contracts.user.CreateUserPreferenceEvent

spring.kafka.producer.properties.spring.json.add.type.headers =true

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:30s}
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=*

# RS256 public verification key (X.509 PEM); fail startup when missing.
jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION:}
jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION:}

# RFC 9068 access-token profile and JWKS signing-key set
jwt.active-kid=${JWT_ACTIVE_KID:local-key-1}
jwt.extra-public-keys=${JWT_EXTRA_PUBLIC_KEYS:}
jwt.issuer=${JWT_ISSUER:https://auth.vellumhub.local}
jwt.audience=${JWT_AUDIENCE:api://vellumhub}
jwt.client-id=${JWT_CLIENT_ID:vellumhub-web}
