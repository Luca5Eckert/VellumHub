spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION}
jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

management.endpoint.health.show-details=never

google.client.id=${GOOGLE_CLIENT_ID}

jwt.active-kid=${JWT_ACTIVE_KID:local-key-1}
jwt.extra-public-keys=${JWT_EXTRA_PUBLIC_KEYS:}
jwt.issuer=${JWT_ISSUER:https://auth.vellumhub.local}
jwt.audience=${JWT_AUDIENCE:api://vellumhub}
jwt.client-id=${JWT_CLIENT_ID:vellumhub-web}
