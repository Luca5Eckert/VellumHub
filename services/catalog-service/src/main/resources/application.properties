spring.application.name=catalog-service

server.port=${SERVER_PORT:8080}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# Upload Configuration

app.upload.books-dir=./uploads/books

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.health.kafka.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.service=${spring.application.name}

logging.structured.format.console=logstash
logging.structured.json.add.service=${spring.application.name}
logging.structured.json.add.environment=${VELLUM_ENVIRONMENT:local}
logging.structured.json.rename.logger_name=logger

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true

spring.kafka.producer.properties.spring.json.type.mapping=\
  create_book_event:com.vellumhub.kafka.contracts.book.CreateBookEvent,\
  update_book_event:com.vellumhub.kafka.contracts.book.UpdateBookEvent,\
  delete_book_event:com.vellumhub.kafka.contracts.book.DeleteBookEvent, \
  update_book_progress_event:com.vellumhub.kafka.contracts.readingprogress.UpdateBookProgressEvent, \
  create_book_progress_event:com.vellumhub.kafka.contracts.readingprogress.CreateBookProgressEvent, \
  reading_progress_changed_event:com.vellumhub.kafka.contracts.readingprogress.ReadingProgressChangedEvent, \
  book_changed_event:com.vellumhub.kafka.contracts.book.BookChangedEvent

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:30s}
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=*




# RS256 public verification key (X.509 PEM); fail startup when missing.
jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION:}


# Buckets used by HTTP p95/p99 dashboards and latency alerts.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# SEC-14: broker principal is a service identity, never the HTTP JWT subject.
# Production supplies SASL_SSL and per-service JAAS through a Secret.
spring.kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties[sasl.mechanism]=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties[sasl.jaas.config]=${KAFKA_SASL_JAAS_CONFIG:}

# Book Avro remains opt-in; Reading Progress and old Book keep JSON.
app.book.events.wire-format=${BOOK_EVENTS_WIRE_FORMAT:json}
app.book.avro.registry-url=${BOOK_AVRO_REGISTRY_URL:http://127.0.0.1:18081/apis/ccompat/v7}
