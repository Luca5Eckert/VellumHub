server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}
        environment: ${VELLUM_ENVIRONMENT:local}
      rename:
        logger_name: logger
  level:
    org.springframework.cloud.gateway: TRACE

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user
              uri: ${USER_SERVICE_URL:http://user-service:8080}
              predicates:
                - Path=/api/v1/users/**
              filters:
                - StripPrefix=2
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10

            - id: auth
              uri: ${USER_SERVICE_URL:http://user-service:8080}
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - StripPrefix=2
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10

            - id: catalogs
              uri: ${CATALOG_SERVICE_URL:http://catalog-service:8080}
              predicates:
                - Path=/api/v1/catalog/**
              filters:
                - StripPrefix=3
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 30
                    redis-rate-limiter.burstCapacity: 60

            - id: engagements
              uri: ${ENGAGEMENT_SERVICE_URL:http://engagement-service:8080}
              predicates:
                - Path=/api/v1/engagement/**
              filters:
                - StripPrefix=3
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 30
                    redis-rate-limiter.burstCapacity: 60

            - id: recommendations
              uri: ${RECOMMENDATION_SERVICE_URL:http://recommendation-service:8080}
              predicates:
                - Path=/api/v1/recommendations/**
              filters:
                - StripPrefix=2
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40

            - id: user-openapi
              uri: ${USER_SERVICE_URL:http://user-service:8080}
              predicates:
                - Path=/docs/user/v3/api-docs
              filters:
                - StripPrefix=2

            - id: catalog-openapi
              uri: ${CATALOG_SERVICE_URL:http://catalog-service:8080}
              predicates:
                - Path=/docs/catalog/v3/api-docs
              filters:
                - StripPrefix=2

            - id: engagement-openapi
              uri: ${ENGAGEMENT_SERVICE_URL:http://engagement-service:8080}
              predicates:
                - Path=/docs/engagement/v3/api-docs
              filters:
                - StripPrefix=2

            - id: recommendation-openapi
              uri: ${RECOMMENDATION_SERVICE_URL:http://recommendation-service:8080}
              predicates:
                - Path=/docs/recommendation/v3/api-docs
              filters:
                - StripPrefix=2

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_KEY}

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      connect-timeout: 2s

springdoc:
  swagger-ui:
    path: /docs
    disable-swagger-default-url: true
    urls:
      - name: User Service
        url: /docs/user/v3/api-docs
      - name: Catalog Service
        url: /docs/catalog/v3/api-docs
      - name: Engagement Service
        url: /docs/engagement/v3/api-docs
      - name: Recommendation Service
        url: /docs/recommendation/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: '*'
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    kafka:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      service: ${spring.application.name}

  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
