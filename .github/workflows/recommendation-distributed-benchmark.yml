name: Recommendation distributed benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/kafka-contracts/**'
      - 'services/recommendation-service/src/main/**'
      - 'services/recommendation-service/src/test/java/com/vellumhub/recommendation_service/benchmark/**'
      - 'services/recommendation-service/src/test/java/com/vellumhub/recommendation_service/support/DistributedIntegrationTestSupport.java'
      - 'services/recommendation-service/benchmark/**'
      - '.github/workflows/recommendation-distributed-benchmark.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark profile
        required: true
        default: reference
        type: choice
        options:
          - reference
          - smoke
          - stress

permissions:
  contents: read

jobs:
  distributed-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BENCHMARK_PROFILE: ${{ github.event_name == 'pull_request' && 'smoke' || inputs.profile == 'stress' && 'smoke' || inputs.profile || 'reference' }}
      # One focused reference-load investigation on #367; other PRs retain smoke.
      CACHE_BENCHMARK_PROFILE: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 367 && 'reference' || github.event_name == 'pull_request' && 'smoke' || inputs.profile || 'reference' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Confirm Docker for distributed Testcontainers
        run: docker info

      - name: Pre-pull benchmark images
        run: |
          docker pull pgvector/pgvector:pg15
          docker pull confluentinc/cp-kafka:7.5.0
          docker pull redis:7.4-alpine

      - name: Focused cache and ranked read unit tests
        run: >-
          mvn -B -ntp -pl services/recommendation-service -am
          -Dtest=RecommendationResponseCacheTest,GetRecommendationsUseCaseTest,SpringRecommendationRepositoryAdapterTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

      # Keep the two distributed suites in separate Maven processes. Both suites own
      # static Testcontainers/Spring test state and use the production Kafka consumer
      # group; running them in one Surefire JVM allows lifecycle/state interference.
      - name: Run projection convergence and read-autonomy benchmark
        run: >-
          mvn -B -ntp -pl services/recommendation-service -am
          -Dtest=DistributedRecommendationBenchmarkIT
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dgroups=distributed-benchmark
          -Dbenchmark.profile=${BENCHMARK_PROFILE}
          -Dbenchmark.commitSha=${{ github.event.pull_request.head.sha || github.sha }}
          -Dbenchmark.outputDir=${GITHUB_WORKSPACE}/services/recommendation-service/target/distributed-benchmark/${BENCHMARK_PROFILE}
          -Dbenchmark.command='mvn -pl services/recommendation-service -am -Dtest=DistributedRecommendationBenchmarkIT -Dsurefire.failIfNoSpecifiedTests=false -Dgroups=distributed-benchmark -Dbenchmark.profile=${BENCHMARK_PROFILE} test'
          test

      - name: Run event-to-recommendation freshness benchmark
        run: >-
          mvn -B -ntp -pl services/recommendation-service -am
          -Dtest=RecommendationFreshnessBenchmarkIT
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dgroups=distributed-benchmark
          -Dbenchmark.profile=${BENCHMARK_PROFILE}
          -Dbenchmark.commitSha=${{ github.event.pull_request.head.sha || github.sha }}
          -Dbenchmark.outputDir=${GITHUB_WORKSPACE}/services/recommendation-service/target/distributed-benchmark/${BENCHMARK_PROFILE}
          test

      # Reuse this existing job instead of adding another mandatory workflow/check.
      # Cache correctness, one-query hydration and A/B reference use separate JVM lifecycles from the
      # existing Kafka convergence/freshness harnesses.
      - name: Verify Redis cache and pre-warmed event freshness
        run: >-
          mvn -B -ntp -pl services/recommendation-service -am
          -Dtest=RecommendationResponseRedisIT,RecommendationCacheFreshnessIT,RecommendationBatchHydrationIT
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dgroups=distributed,distributed-benchmark
          test

      - name: Measure cache-disabled authenticated read smoke
        run: >-
          mvn -B -ntp -pl services/recommendation-service -am
          -Dtest=RecommendationCacheReadBenchmarkIT
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dgroups=cache-benchmark
          -Dcache.benchmark.enabled=false
          -Dbenchmark.profile=${CACHE_BENCHMARK_PROFILE}
          -Dbenchmark.commitSha=${{ github.event.pull_request.head.sha || github.sha }}
          test

      - name: Measure cache-enabled authenticated read smoke
        run: >-
          mvn -B -ntp -pl services/recommendation-service -am
          -Dtest=RecommendationCacheReadBenchmarkIT
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dgroups=cache-benchmark
          -Dcache.benchmark.enabled=true
          -Dbenchmark.profile=${CACHE_BENCHMARK_PROFILE}
          -Dbenchmark.commitSha=${{ github.event.pull_request.head.sha || github.sha }}
          test

      - name: Assert AFF-REC-009 and AFF-OPS-010 from JUnit and raw evidence
        if: always()
        run: >-
          python3 tools/architecture/generate_evidence.py
          --profile ${BENCHMARK_PROFILE}
          --sha ${{ github.event.pull_request.head.sha || github.sha }}
          --benchmark-dir services/recommendation-service/target/distributed-benchmark/${BENCHMARK_PROFILE}
          --require AFF-REC-009 --require AFF-OPS-010

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-distributed-benchmark-${{ env.BENCHMARK_PROFILE }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            services/recommendation-service/target/distributed-benchmark/${{ env.BENCHMARK_PROFILE }}/
            target/architecture-evidence/
            services/recommendation-service/target/cache-benchmark/
          if-no-files-found: error
          retention-days: 30
