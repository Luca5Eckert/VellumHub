name: Catalog Redis cache benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/catalog-service/src/main/**'
      - 'services/catalog-service/src/test/**'
      - '.github/workflows/catalog-cache-benchmark.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: Catalog Redis benchmark profile
        required: true
        default: reference
        type: choice
        options: [smoke, reference, stress]

# A newer PR commit supersedes its earlier, costly A/B runs.
concurrency:
  group: catalog-cache-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  catalog-redis-cache-ab:
    name: Catalog Redis A/B and integration
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROFILE: ${{ github.event_name == 'pull_request' && 'reference' || inputs.profile || 'reference' }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Docker availability and Testcontainers image prefetch
        run: |
          docker info
          docker pull postgres:15-alpine
          docker pull redis:7.4-alpine
          docker pull testcontainers/ryuk:0.11.0
      - name: Real Redis invalidation, stale-fill and two-instance tests
        run: >-
          mvn -B -ntp -pl services/catalog-service -am
          -Dtest=BookReadCacheRedisIT,BookReadCacheNoEvictionIT
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dgroups=distributed
          test
      - name: Real Catalog contexts, DB rollback and Redis-absent startup
        run: >-
          mvn -B -ntp -pl services/catalog-service -am
          -Dtest=CatalogCacheTwoContextsIT,CatalogCacheRedisOutageBootIT,CatalogCacheNetworkHttpIT
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dgroups=catalog-cache-e2e
          test
      - name: Compose optional Redis dependencies sanity gate
        shell: bash
        run: |
          # compose.yaml also references a literal .env service env_file; supply
          # only non-secret test placeholders (never commit this generated file).
          cp .env.example .env
          trap 'rm -f .env' EXIT
          docker compose --env-file .env.example config --format json > /tmp/cache-compose.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/cache-compose.json'))['services']
          for name in ('catalog-service','recommendation-service'):
              deps=data[name].get('depends_on',{})
              assert 'redis-recommendation-cache' not in deps, (name,deps)
          catalog=data['catalog-service']['environment']
          assert catalog['CATALOG_CACHE_ENABLED'].lower()=='true'
          assert catalog['CATALOG_CACHE_INVALIDATION_ENABLED'].lower()=='true'
          print("Cache optional in Compose; local read+writer flags enabled")
          PY
      - name: Baseline OFF (real PostgreSQL + Redis + authenticated MockMvc)
        run: >-
          mvn -B -ntp -pl services/catalog-service -am
          -Dtest=CatalogCacheReadBenchmarkIT
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dgroups=catalog-cache-benchmark
          -Dcatalog.cache.benchmark.enabled=false
          -Dcatalog.benchmark.profile=${{ env.PROFILE }}
          -Dcatalog.benchmark.commitSha=${{ env.SOURCE_SHA }}
          test
      - name: Cache ON (same data, code and runner category)
        run: >-
          mvn -B -ntp -pl services/catalog-service -am
          -Dtest=CatalogCacheReadBenchmarkIT
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dgroups=catalog-cache-benchmark
          -Dcatalog.cache.benchmark.enabled=true
          -Dcatalog.benchmark.profile=${{ env.PROFILE }}
          -Dcatalog.benchmark.commitSha=${{ env.SOURCE_SHA }}
          test
      - name: Validate report completeness and both A/B modes
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path('services/catalog-service/target/catalog-cache-benchmark')/os.environ['SOURCE_SHA']
          off=json.loads((root/'off.json').read_text())
          on=json.loads((root/'on.json').read_text())
          assert off['enabled'] is False and on['enabled'] is True
          assert off['commit_sha']==on['commit_sha']==os.environ['SOURCE_SHA']
          assert off['profile']==on['profile']==os.environ['PROFILE']
          assert off['request_count']==on['request_count']
          assert len(off['rows'])==len(on['rows'])
          assert 'explain_first_page' in off and 'explain_genres' in off
          for mode in (off,on):
              assert all(row['errors']==0 for row in mode['rows'])
              assert all(row['cpu_worker_ns'] is not None for row in mode['rows'])
              assert all(row['peak_hikari_active_sampled'] >= 0 for row in mode['rows'])
              assert all(row['gc_collections'] >= 0 for row in mode['rows'])
              assert all(row['response_hash_sum'] > 0 for row in mode['rows'])
          for a,b in zip(off['rows'],on['rows']):
              assert (a['scenario'],a['concurrency'],a['rep']) == (b['scenario'],b['concurrency'],b['rep'])
              assert a['response_hash_sum'] == b['response_hash_sum'], "Cache changed response content"
          print('Catalog A/B verified same-response evidence:',off['request_count']+on['request_count'],'GETs')
          PY
      - name: Archive raw benchmark evidence and JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-cache-ab-${{ env.PROFILE }}-${{ env.SOURCE_SHA }}
          path: |
            services/catalog-service/target/catalog-cache-benchmark/
            services/catalog-service/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 30
