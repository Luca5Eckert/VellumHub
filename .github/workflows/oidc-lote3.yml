name: SEC-07 and SEC-08 Federated OIDC and Sessions
on:
  pull_request:
    paths:
      - 'services/auth-service/**'
      - 'services/user-service/**'
      - 'infra/observability/prometheus/**'
      - 'docker-compose.oidc-lote3.yml'
      - '.github/workflows/oidc-lote3.yml'
  push:
    branches: [main]
    paths:
      - 'services/auth-service/**'
      - 'services/user-service/**'
      - 'infra/observability/prometheus/**'
      - 'docker-compose.oidc-lote3.yml'
jobs:
  auth-federation-session:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and verify Auth and shared JWT contracts
        run: mvn -B -ntp -pl services/auth-service -am clean verify
      - name: Validate Prometheus config and alert rules
        run: docker run --rm --entrypoint promtool -v "$PWD/infra/observability/prometheus:/etc/prometheus:ro" prom/prometheus:v3.12.0 check config /etc/prometheus/prometheus.yml
      - name: Validate opt-in Compose with placeholders (never calls Google)
        env:
          JWT_ISSUER: http://127.0.0.1:9000
          POSTGRES_CATALOG_USER: ci_catalog
          POSTGRES_CATALOG_PASSWORD: ci-only
          POSTGRES_ENGAGEMENT_USER: ci_engagement
          POSTGRES_ENGAGEMENT_PASSWORD: ci-only
          POSTGRES_USER_USER: ci_user
          POSTGRES_USER_PASSWORD: ci-only
          POSTGRES_RECOMMENDATION_USER: ci_recommendation
          POSTGRES_RECOMMENDATION_PASSWORD: ci-only
          JWT_PUBLIC_KEY_PATH: /dev/null
          JWT_PRIVATE_KEY_PATH: /dev/null
          CORS_ALLOWED_ORIGINS: http://127.0.0.1:9100
          VELLUM_POC_RUN_AS: 1001:1001
          VELLUM_AUTH_KEY_DIR: /tmp
          POSTGRES_AUTH_USER: ci_auth
          POSTGRES_AUTH_PASSWORD: placeholder-local-only
          VELLUM_POC_LOGIN: test@example.invalid
          VELLUM_POC_PASSWORD: test-password-only-long-enough
          VELLUM_INTERNAL_PROVISION_KEY: test-internal-provision-key-must-be-long
          VELLUM_GOOGLE_CLIENT_ID: mock-google-client-id
          VELLUM_GOOGLE_CLIENT_SECRET: mock-google-client-secret
        run: |
          touch .env
          docker compose -f docker-compose.yml -f docker-compose.oidc-lote2.yml -f docker-compose.oidc-lote3.yml config --quiet

      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oidc-lote3-test-reports
          path: |
            services/auth-service/target/surefire-reports/**
            lib/jwt-security/target/surefire-reports/**
