name: Verify application artifacts

on:
  workflow_call:

jobs:
  maven-verify:
    name: Maven verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Lint PR and main release workflow syntax before Maven
        run: |
          docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12 \
            .github/workflows/ci.yml \
            .github/workflows/verify-images.yml \
            .github/workflows/kubernetes-m18-full-stack.yml \
            .github/workflows/publish-images.yml
      - name: Verify CI integrity contracts (fail-closed)
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v
      - name: Compile Kubernetes benchmark and CI test harness sources
        run: python3 -m py_compile deploy/kubernetes/scripts/benchmark-full-stack.py deploy/kubernetes/scripts/kind_gate_contract.py tools/ci/image_artifact.py tools/ci/release_manifest.py infra/scripts/security/verify_kind_business_flows.py
      - name: Confirm Docker for Testcontainers
        run: docker info
      - name: Verify reactor and non-distributed integration tests
        run: mvn -B -ntp -DexcludedGroups=distributed clean verify


      - name: Generate reactor AFF evidence
        if: always()
        run: python3 tools/architecture/generate_evidence.py --profile reactor --sha ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Upload reactor AFF evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aff-reactor-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/architecture-evidence/
          if-no-files-found: warn
          retention-days: 30

  distributed-integration:
    name: Distributed integration / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: catalog, module: services/catalog-service, test: ''}
          - {name: engagement, module: services/engagement-service, test: ''}
          - {name: recommendation, module: services/recommendation-service, test: ''}
          - {name: cross-service, module: integration-tests/distributed-e2e, test: CatalogToRecommendationE2ETest}
    # Preparation includes cold Maven/image downloads plus evidence upload.
    # The actual distributed test command retains its independent 150-second gate.
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Confirm Docker for Testcontainers
        run: docker info
      - name: Pre-pull distributed test images
        run: |
          docker pull testcontainers/ryuk:0.11.0
          docker pull pgvector/pgvector:pg15
          docker pull postgres:15-alpine
          docker pull confluentinc/cp-kafka:7.5.0
          docker pull apicurio/apicurio-registry:3.1.7
      - name: Warm Maven dependencies and compilation
        run: mvn -B -ntp -Pdistributed-e2e -pl ${{ matrix.module }} -am -DskipTests test-compile
      - name: Run distributed suite within 150 second execution budget
        shell: bash
        env:
          DISTRIBUTED_MODULE: ${{ matrix.module }}
          DISTRIBUTED_TEST: ${{ matrix.test }}
        run: |
          suite_args=()
          if [[ -n "$DISTRIBUTED_TEST" ]]; then
            suite_args+=("-Dtest=$DISTRIBUTED_TEST" -Dsurefire.failIfNoSpecifiedTests=false)
          fi
          started_at=$(date +%s)
          mvn -B -ntp -T 2 -Pdistributed-e2e -pl "$DISTRIBUTED_MODULE" -am \
            -Dgroups=distributed -DexcludedGroups=book-avro-e2e "${suite_args[@]}" test
          elapsed=$(( $(date +%s) - started_at ))
          echo "Distributed integration suite execution: ${elapsed}s"
          if (( elapsed > 150 )); then
            echo "Distributed integration suite exceeded the 150 second execution budget."
            exit 1
          fi


      - name: Preserve original JUnit paths for combined architecture evidence
        if: always()
        env:
          DISTRIBUTED_SHARD: ${{ matrix.name }}
        run: |
          python3 - <<'PYTHON'
          import os, tarfile
          from pathlib import Path
          Path('target').mkdir(exist_ok=True)
          with tarfile.open('target/distributed-'+os.environ['DISTRIBUTED_SHARD']+'.tar', 'w') as archive:
              for root in ('services', 'lib', 'integration-tests'):
                  for report in Path(root).glob('**/target/surefire-reports/TEST-*.xml'):
                      archive.add(report, arcname=str(report))
          PYTHON
      - name: Upload distributed JUnit shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distributed-junit-${{ matrix.name }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/distributed-${{ matrix.name }}.tar
          overwrite: true
          if-no-files-found: error
          retention-days: 30

  distributed-evidence:
    name: Combined distributed architecture evidence
    needs: distributed-integration
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: distributed-junit-*-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/distributed-inputs
          merge-multiple: true
      - name: Restore original JUnit paths from all four executed shards
        run: |
          python3 - <<'PYTHON'
          import tarfile
          from pathlib import Path
          archives = list(Path('target/distributed-inputs').glob('distributed-*.tar'))
          if len(archives) != 4:
              raise SystemExit('Expected executed reports from all four distributed shards')
          for archive in archives:
              with tarfile.open(archive) as source:
                  source.extractall('.', filter='data')
          PYTHON
      - name: Generate distributed behavioral AFF evidence
        run: python3 tools/architecture/generate_evidence.py --profile behavioral --sha ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Upload behavioral AFF evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aff-behavioral-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/architecture-evidence/
          overwrite: true
          if-no-files-found: warn
          retention-days: 30

  build-and-scan:
    name: Build and scan ${{ matrix.service }}
    needs:
      - maven-verify
      - distributed-integration
      - distributed-evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway-service
            image: vellumhub-gateway
            dockerfile: services/gateway-service/Dockerfile
          - service: auth-service
            image: vellumhub-auth
            dockerfile: services/auth-service/Dockerfile
          - service: user-service
            image: vellumhub-user
            dockerfile: services/user-service/Dockerfile
          - service: catalog-service
            image: vellumhub-catalog
            dockerfile: services/catalog-service/Dockerfile
          - service: engagement-service
            image: vellumhub-engagement
            dockerfile: services/engagement-service/Dockerfile
          - service: recommendation-service
            image: vellumhub-recommendation
            dockerfile: services/recommendation-service/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ghcr.io/luca5eckert/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.service }}
      - name: Scan the EXACT image that may be published
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/luca5eckert/${{ matrix.image }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL
      - name: Prepare verified-image evidence directory
        run: mkdir -p target/ci-images
      - name: Generate CycloneDX SBOM for the scanned image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/luca5eckert/${{ matrix.image }}:${{ github.sha }}
          format: cyclonedx
          output: target/ci-images/${{ matrix.image }}.cdx.json
          exit-code: '0'
      # GitHub Actions reusable-workflow artifacts are available to downstream
      # jobs in the same caller run. Never build the release image a second time.
      - name: Preserve tested image bytes and image config digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/ci-images
          image="ghcr.io/luca5eckert/${{ matrix.image }}:${GITHUB_SHA}"
          docker save "$image" | zstd -T2 -1 -o "target/ci-images/${{ matrix.image }}.tar.zst"
          python3 tools/ci/image_artifact.py record \
            --sha "$GITHUB_SHA" --image "$image" \
            --archive "target/ci-images/${{ matrix.image }}.tar.zst" \
            --metadata "target/ci-images/${{ matrix.image }}.json"
      - name: Transfer scanned image without rebuilding
        uses: actions/upload-artifact@v4
        with:
          name: verified-image-${{ matrix.image }}
          path: |
            target/ci-images/${{ matrix.image }}.tar.zst
            target/ci-images/${{ matrix.image }}.json
            target/ci-images/${{ matrix.image }}.cdx.json
          retention-days: 2
          if-no-files-found: error

  training-export:
    name: Training exporter + PostgreSQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: training_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e 'training[test]'
      - run: python -m pytest training/tests -q
        env:
          TEST_POSTGRES_URL: postgresql://test:test@localhost:5432/training_test
