name: SEC-06 and SEC-09 OIDC Gateway Batch

on:
  pull_request:
    paths:
      - 'services/auth-service/**'
      - 'services/user-service/**'
      - 'services/gateway-service/**'
      - 'lib/jwt-security/**'
      - 'docker-compose.oidc-lote2.yml'
      - '.github/workflows/oidc-lote2.yml'
  push:
    branches: [main]
    paths:
      - 'services/auth-service/**'
      - 'services/user-service/**'
      - 'services/gateway-service/**'

jobs:
  auth-user-gateway:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and verify SEC-06/09 + JWT shared library
        run: mvn -B -ntp -pl services/auth-service,services/user-service,services/gateway-service -am clean verify
      - name: Validate explicit local OIDC Compose overlay
        env:
          JWT_ISSUER: http://127.0.0.1:9000
          POSTGRES_CATALOG_USER: ci_catalog
          POSTGRES_CATALOG_PASSWORD: ci-only
          POSTGRES_ENGAGEMENT_USER: ci_engagement
          POSTGRES_ENGAGEMENT_PASSWORD: ci-only
          POSTGRES_USER_USER: ci_user
          POSTGRES_USER_PASSWORD: ci-only
          POSTGRES_RECOMMENDATION_USER: ci_recommendation
          POSTGRES_RECOMMENDATION_PASSWORD: ci-only
          JWT_PUBLIC_KEY_PATH: /dev/null
          JWT_PRIVATE_KEY_PATH: /dev/null
          CORS_ALLOWED_ORIGINS: http://127.0.0.1:9100
          VELLUM_POC_RUN_AS: 1001:1001
          VELLUM_AUTH_KEY_DIR: /tmp
          POSTGRES_AUTH_USER: ci_auth
          POSTGRES_AUTH_PASSWORD: test-db-placeholder-only
          VELLUM_POC_LOGIN: test@example.invalid
          VELLUM_POC_PASSWORD: test-password-only-long-enough
          VELLUM_INTERNAL_PROVISION_KEY: test-internal-provision-key-must-be-long
        run: |
          # The integration overlay intentionally does not define the normal
          # services' images/build; validate its actual composition with base.
          touch .env
          docker compose -f docker-compose.yml -f docker-compose.oidc-lote2.yml config --quiet

  distributed-oidc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Real Auth User Gateway Catalog PKCE E2E and AS outage
        run: bash infra/scripts/security/run_oidc_lote2_e2e.sh
