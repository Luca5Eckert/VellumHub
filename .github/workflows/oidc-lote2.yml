name: SEC-06 and SEC-09 OIDC Gateway Batch

on:
  pull_request:
    paths:
      - 'services/auth-service/**'
      - 'services/user-service/**'
      - 'services/gateway-service/**'
      - 'lib/jwt-security/**'
      - 'docker-compose.oidc-lote2.yml'
      - '.github/workflows/oidc-lote2.yml'
  push:
    branches: [main]
    paths:
      - 'services/auth-service/**'
      - 'services/user-service/**'
      - 'services/gateway-service/**'

jobs:
  auth-user-gateway:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and verify SEC-06/09 + JWT shared library
        run: mvn -B -ntp -Pauth-poc -pl services/auth-service,services/user-service,services/gateway-service -am clean verify
      - name: Validate explicit local OIDC Compose overlay
        env:
          JWT_ISSUER: http://127.0.0.1:9000
          CORS_ALLOWED_ORIGINS: http://127.0.0.1:9100
          VELLUM_POC_RUN_AS: 1001:1001
          VELLUM_AUTH_DB_PASSWORD: test-db-placeholder-only
          VELLUM_POC_LOGIN: test@example.invalid
          VELLUM_POC_PASSWORD: test-password-only-long-enough
          VELLUM_INTERNAL_PROVISION_KEY: test-internal-provision-key-must-be-long
        run: |
          # Main Compose also requires other application credentials; use the
          # integration overlay in a full environment (see batch README).
          docker compose -f docker-compose.oidc-lote2.yml config --quiet
