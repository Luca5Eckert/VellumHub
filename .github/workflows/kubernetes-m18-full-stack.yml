name: Kubernetes M18 full-stack Java (kind)

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: m18-full-stack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind-full-stack:
    name: Six real Java apps + dependencies + lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/download-artifact@v4
        with:
          pattern: verified-image-*
          path: target/ci-images
          merge-multiple: true
      - name: Install kind / verify Docker
        run: |
          set -euo pipefail
          docker info
          curl -fsSL https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64 -o kind
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          kind version
      - name: Create isolated Kubernetes cluster
        run: |
          kind create cluster --name vellumhub-m18-full --image kindest/node:v1.31.2 --wait 120s
      - name: Verify and import EXACT six scanned images into Kind
        shell: bash
        run: |
          set -euo pipefail
          for name in gateway auth user catalog engagement recommendation; do
            image="ghcr.io/luca5eckert/vellumhub-$name:$SOURCE_SHA"
            archive="target/ci-images/vellumhub-$name.tar.zst"
            meta="target/ci-images/vellumhub-$name.json"
            python3 tools/ci/image_artifact.py verify \
              --sha "$SOURCE_SHA" --image "$image" --archive "$archive" --metadata "$meta"
            zstd -dc "$archive" | docker load
            python3 tools/ci/image_artifact.py loaded \
              --sha "$SOURCE_SHA" --image "$image" --archive "$archive" --metadata "$meta"
            kind load docker-image "$image" --name vellumhub-m18-full
          done
          docker image ls --format '{{.Repository}}:{{.Tag}}' |
            grep 'ghcr.io/luca5eckert/vellumhub-'
      - name: Build digest-distinct Gateway candidate from approved Java image
        shell: bash
        run: |
          set -euo pipefail
          original="ghcr.io/luca5eckert/vellumhub-gateway:$SOURCE_SHA"
          candidate="${original}-m18-candidate"
          # Digest-distinct image metadata; unchanged Java JAR.
          printf 'FROM %s\nLABEL ci.vellumhub.m18.candidate="true"\n' "$original" |
            docker build --pull=false --network=none -t "$candidate" -f - .
          old_id="$(docker image inspect --format '{{.Id}}' "$original")"
          new_id="$(docker image inspect --format '{{.Id}}' "$candidate")"
          test "$old_id" != "$new_id" || { echo "Candidate image must differ"; exit 1; }
          kind load docker-image "$candidate" --name vellumhub-m18-full
          mkdir -p target/metrics
          printf 'base=%s\ncandidate=%s\n' "$old_id" "$new_id" > target/metrics/m18-gateway-image-ids.txt
      - name: Ephemeral secrets, signing material and namespace
        shell: bash
        run: |
          set -euo pipefail
          kubectl create namespace vellumhub
          install -d -m 700 target/ephemeral-keys
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out target/ephemeral-keys/private.pem 2>/dev/null
          openssl pkey -in target/ephemeral-keys/private.pem -pubout \
            -out target/ephemeral-keys/public.pem
          db_password="$(openssl rand -hex 20)"
          auth_password="$(openssl rand -hex 20)"
          provision_key="$(openssl rand -hex 32)"
          kubectl -n vellumhub create secret generic vellumhub-secrets \
            --from-literal=POSTGRES_USER=vellumhub \
            --from-literal=POSTGRES_PASSWORD="$db_password" \
            --from-literal=POSTGRES_AUTH_USER=auth_owner \
            --from-literal=POSTGRES_AUTH_PASSWORD="$auth_password" \
            --from-literal=VELLUM_INTERNAL_PROVISION_KEY="$provision_key"
          kubectl -n vellumhub create secret generic vellumhub-jwt-private \
            --from-file=private.pem=target/ephemeral-keys/private.pem
          kubectl -n vellumhub create configmap vellumhub-jwt-public \
            --from-file=public.pem=target/ephemeral-keys/public.pem
          rm -rf target/ephemeral-keys

      - name: Stage real OAuth integration harness for in-cluster execution
        run: |
          set -euo pipefail
          kubectl -n vellumhub create configmap vellumhub-ci-business-scripts \
            --from-file=verify_auth_poc_flow.py=infra/scripts/security/verify_auth_poc_flow.py \
            --from-file=verify_oidc_lote2_flow.py=infra/scripts/security/verify_oidc_lote2_flow.py \
            --from-file=verify_kind_business_flows.py=infra/scripts/security/verify_kind_business_flows.py

      - name: M18 - Real apps, startup, HTTP probes, rollout, rollback, restart
        run: python3 deploy/kubernetes/scripts/benchmark-full-stack.py --sha "$SOURCE_SHA"
      - name: Safe Pod / event / deployment diagnostics
        if: failure()
        run: |
          kubectl -n vellumhub get deploy,sts,pod,pvc -o wide || true
          kubectl -n vellumhub get jobs -o wide || true
          kubectl -n vellumhub logs job/vellumhub-business-e2e --tail=60 || true
          kubectl -n vellumhub get events --sort-by=.lastTimestamp | tail -65 || true
          kubectl -n vellumhub get pods -o json |
            python3 -c 'import json,sys; p=json.load(sys.stdin); print("\n".join(x["metadata"]["name"]+" | "+x["status"].get("phase","?")+" | "+",".join(c["name"]+":"+str(c.get("ready"))+":"+str(c.get("restartCount")) for c in x["status"].get("containerStatuses",[])) for x in p["items"]))' || true
      - name: Archive raw measured evidence and manifest rendering
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vellumhub-m18-full-stack-${{ env.SOURCE_SHA }}
          path: |
            target/metrics/kubernetes-full-stack.json
            target/metrics/kubernetes-full-stack-rendered.yaml
            target/metrics/m18-gateway-image-ids.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Destroy disposable cluster
        if: always()
        run: kind delete cluster --name vellumhub-m18-full || true
