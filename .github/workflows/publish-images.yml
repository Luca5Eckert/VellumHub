name: Publish validated images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  verify:
    uses: ./.github/workflows/verify-images.yml

  publish:
    name: Publish ${{ matrix.service }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway-service
            image: vellumhub-gateway
            dockerfile: services/gateway-service/Dockerfile
          - service: auth-service
            image: vellumhub-auth
            dockerfile: services/auth-service/Dockerfile
          - service: user-service
            image: vellumhub-user
            dockerfile: services/user-service/Dockerfile
          - service: catalog-service
            image: vellumhub-catalog
            dockerfile: services/catalog-service/Dockerfile
          - service: engagement-service
            image: vellumhub-engagement
            dockerfile: services/engagement-service/Dockerfile
          - service: recommendation-service
            image: vellumhub-recommendation
            dockerfile: services/recommendation-service/Dockerfile
    env:
      IMAGE: ghcr.io/luca5eckert/${{ matrix.image }}
    steps:
      # These bytes were scanned in reusable verify-images.yml in THIS
      # push workflow run. A new build here would break artifact identity.
      - uses: actions/checkout@v4
      - name: Download verified image and integrity manifest
        uses: actions/download-artifact@v4
        with:
          name: verified-image-${{ matrix.image }}
          path: target/ci-images
      - name: Verify SHA and bytes before loading
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/image_artifact.py verify \
            --sha "$GITHUB_SHA" --image "$IMAGE:$GITHUB_SHA" \
            --archive "target/ci-images/${{ matrix.image }}.tar.zst" \
            --metadata "target/ci-images/${{ matrix.image }}.json"
      - name: Restore EXACT scanned image
        shell: bash
        run: |
          set -euo pipefail
          zstd -t "target/ci-images/${{ matrix.image }}.tar.zst"
          zstd -dc "target/ci-images/${{ matrix.image }}.tar.zst" | docker load
          python3 tools/ci/image_artifact.py loaded \
            --sha "$GITHUB_SHA" --image "$IMAGE:$GITHUB_SHA" \
            --archive "target/ci-images/${{ matrix.image }}.tar.zst" \
            --metadata "target/ci-images/${{ matrix.image }}.json"
      - name: Authenticate to GHCR for publication on main only
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify CycloneDX SBOM exists before releasing
        shell: bash
        run: |
          set -euo pipefail
          test -s "target/ci-images/${{ matrix.image }}.cdx.json"
          python3 -c 'import json,sys; p=json.load(open(sys.argv[1])); assert p.get("bomFormat") == "CycloneDX"' "target/ci-images/${{ matrix.image }}.cdx.json"
      - name: Push immutable SHA image and record registry manifest digest
        id: push
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/release
          docker push "$IMAGE:$GITHUB_SHA" | tee target/release/push.log
          digest="$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' target/release/push.log | tail -1)"
          test -n "$digest" || { echo "Registry did not return a manifest digest"; exit 1; }
          docker buildx imagetools inspect "$IMAGE@$digest" >/dev/null
          printf '%s@%s\n' "$IMAGE" "$digest" > target/release/image-reference.txt
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:main"
          docker push "$IMAGE:main"
          # Registry manifest digest and local config digest are distinct.
          rm -f target/release/push.log
      - name: Attest released digest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest exact-image CycloneDX SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: target/ci-images/${{ matrix.image }}.cdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@v4
        with:
          name: release-image-reference-${{ matrix.image }}
          path: |
            target/release/image-reference.txt
            target/ci-images/${{ matrix.image }}.json
            target/ci-images/${{ matrix.image }}.cdx.json
          retention-days: 30
          if-no-files-found: error
