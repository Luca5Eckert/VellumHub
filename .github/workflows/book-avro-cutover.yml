name: Book Avro staged Kubernetes and ACL gate
on:
  pull_request:
    paths:
      - 'deploy/kubernetes/book-avro/**'
      - 'lib/kafka-avro-contracts/**'
      - 'services/catalog-service/**'
      - 'services/recommendation-service/**'
      - 'services/engagement-service/**'
      - 'infra/kafka/acl-policy.json'
      - 'tools/book_avro_cutover/**'
      - '.github/workflows/book-avro-cutover.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/kubernetes/book-avro/**'
      - 'lib/kafka-avro-contracts/**'
      - 'tools/book_avro_cutover/**'
      - 'infra/kafka/acl-policy.json'
permissions: {contents: read}
jobs:
  static-topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: azure/setup-kubectl@v4
        with: {version: v1.31.2}
      - run: python3 -m pip install 'PyYAML==6.0.2'
      - run: |
          for phase in local consumers producer; do
            kubectl kustomize "deploy/kubernetes/book-avro/overlays/$phase" > "/tmp/book-avro-$phase.yaml"
          done
          python3 tools/book_avro_cutover/check_topology.py /tmp/book-avro-local.yaml /tmp/book-avro-consumers.yaml /tmp/book-avro-producer.yaml
          python3 tools/book_avro_cutover/check_acl.py
