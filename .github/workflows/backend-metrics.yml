name: Backend metrics reference (manual)

on:
  workflow_dispatch:
  # Run this heavy reference suite on PRs that change its evidence harness.
  pull_request:
    paths:
      - 'tools/metrics/analyze_outcomes.py'
      - 'tools/metrics/test_analyze_outcomes.py'
      - '.github/workflows/backend-metrics.yml'

permissions:
  contents: read

concurrency:
  group: backend-metrics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validate outcome analysis offline contracts
        run: python3 -m unittest discover -s tools/metrics -p 'test_analyze_outcomes.py' -v

      - name: Docker prerequisites
        run: |
          docker info
          docker pull pgvector/pgvector:pg15
          docker pull confluentinc/cp-kafka:7.5.0

      - name: M07 - Projection and autonomous reads (reference)
        run: |
          mvn -B -ntp -pl services/recommendation-service -am \
            -Dtest=DistributedRecommendationBenchmarkIT \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dgroups=distributed-benchmark \
            -Dbenchmark.profile=reference \
            -Dbenchmark.outputDir="${GITHUB_WORKSPACE}/services/recommendation-service/target/distributed-benchmark/reference" \
            -Dbenchmark.commitSha="${SOURCE_SHA}" test

      - name: M07 - Recommendation freshness (separate Maven process)
        run: |
          mvn -B -ntp -pl services/recommendation-service -am \
            -Dtest=RecommendationFreshnessBenchmarkIT \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dgroups=distributed-benchmark \
            -Dbenchmark.profile=reference \
            -Dbenchmark.outputDir="${GITHUB_WORKSPACE}/services/recommendation-service/target/distributed-benchmark/reference" \
            -Dbenchmark.commitSha="${SOURCE_SHA}" test

      - name: M10 - Ranking quality on production embedding pipeline
        run: |
          mvn -B -ntp -pl services/recommendation-service -am \
            -Dtest=RecommendationQualityEvaluationIT \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dgroups=evaluation \
            -Devaluation.outputDir="${GITHUB_WORKSPACE}/services/recommendation-service/target/evaluation-results/reference" \
            -Devaluation.commitSha="${SOURCE_SHA}" test

      - name: M08/M09 - Distributed idempotency and authorization suites
        run: bash tools/metrics/run-contract-suites.sh

      - name: Summarize SHA-bound evidence
        if: always()
        run: python3 tools/metrics/collect_evidence.py --sha "${SOURCE_SHA}" --profile reference

      - name: Analyze observed backend outcomes (no extrapolated capacity)
        if: success()
        run: python3 tools/metrics/analyze_outcomes.py --sha "${SOURCE_SHA}"

      - name: Upload original reports and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vellumhub-backend-metrics-${{ env.SOURCE_SHA }}
          path: |
            services/recommendation-service/target/distributed-benchmark/reference/
            services/recommendation-service/target/evaluation-results/reference/
            target/metrics/
            **/target/surefire-reports/TEST-*.xml
          if-no-files-found: warn
          retention-days: 30
