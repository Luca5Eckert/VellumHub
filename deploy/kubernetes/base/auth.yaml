apiVersion: v1
kind: Service
metadata: {name: auth-service, labels: {app.kubernetes.io/name: auth-service}}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: auth-service}
  ports:
    - {name: http, port: 9000, targetPort: http}
    - {name: management, port: 9001, targetPort: management}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: auth-service, labels: {app.kubernetes.io/name: auth-service, app.kubernetes.io/part-of: vellumhub}}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app.kubernetes.io/name: auth-service}}
  template:
    metadata: {labels: {app.kubernetes.io/name: auth-service, app.kubernetes.io/part-of: vellumhub}}
    spec:
      terminationGracePeriodSeconds: 35
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: auth-service
          image: ghcr.io/luca5eckert/vellumhub-auth:REPLACE_WITH_IMMUTABLE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 9000}
            - {name: management, containerPort: 9001}
          env:
            - {name: SPRING_PROFILES_ACTIVE, value: prod}
            - {name: SERVER_PORT, value: "9000"}
            - {name: VELLUM_AUTH_MANAGEMENT_PORT, value: "9001"}
            - {name: VELLUM_AUTH_ISSUER, valueFrom: {configMapKeyRef: {name: vellumhub-config, key: JWT_ISSUER}}}
            - {name: VELLUM_AUTH_API_AUDIENCE, valueFrom: {configMapKeyRef: {name: vellumhub-config, key: JWT_AUDIENCE}}}
            - {name: VELLUM_AUTH_ALLOWED_ORIGIN, valueFrom: {configMapKeyRef: {name: vellumhub-config, key: VELLUM_AUTH_ALLOWED_ORIGIN}}}
            - {name: VELLUM_AUTH_DB_URL, valueFrom: {configMapKeyRef: {name: vellumhub-config, key: AUTH_DATASOURCE_URL}}}
            - {name: VELLUM_AUTH_DB_USERNAME, valueFrom: {secretKeyRef: {name: vellumhub-secrets, key: POSTGRES_USER}}}
            - {name: VELLUM_AUTH_DB_PASSWORD, valueFrom: {secretKeyRef: {name: vellumhub-secrets, key: POSTGRES_PASSWORD}}}
            - {name: VELLUM_AUTH_PRIVATE_KEY_PATH, value: /etc/vellumhub/private/private.pem}
            - {name: VELLUM_AUTH_PUBLIC_KEY_PATH, value: /etc/vellumhub/public/public.pem}
            - {name: VELLUM_AUTH_ACTIVE_KID, valueFrom: {configMapKeyRef: {name: vellumhub-config, key: VELLUM_AUTH_ACTIVE_KID}}}
            - {name: VELLUM_IDENTITY_REGISTRATION_ENABLED, value: "true"}
            - {name: VELLUM_IDENTITY_USER_URL, valueFrom: {configMapKeyRef: {name: vellumhub-config, key: USER_SERVICE_URL}}}
            - {name: VELLUM_INTERNAL_PROVISION_KEY, valueFrom: {secretKeyRef: {name: vellumhub-secrets, key: VELLUM_INTERNAL_PROVISION_KEY}}}
            - {name: VELLUM_ENVIRONMENT, valueFrom: {configMapKeyRef: {name: vellumhub-config, key: VELLUM_ENVIRONMENT}}}
          volumeMounts:
            - {name: jwt-private-key, mountPath: /etc/vellumhub/private, readOnly: true}
            - {name: jwt-public-key, mountPath: /etc/vellumhub/public, readOnly: true}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "1", memory: 1Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 10001, capabilities: {drop: [ALL]}}
          startupProbe: {httpGet: {path: /actuator/health/liveness, port: management}, periodSeconds: 5, failureThreshold: 24}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: management}, periodSeconds: 15, failureThreshold: 3}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: management}, periodSeconds: 10, failureThreshold: 3}
      volumes:
        - name: jwt-private-key
          secret: {secretName: vellumhub-jwt-private, items: [{key: private.pem, path: private.pem}]}
        - name: jwt-public-key
          configMap: {name: vellumhub-jwt-public, items: [{key: public.pem, path: public.pem}]}
