# Copy this file outside version control, replace placeholders, then apply it.
# Kubernetes Secrets are only an interface here; use an external secret manager in production.
apiVersion: v1
kind: Secret
metadata:
  name: vellumhub-secrets
type: Opaque
stringData:
  POSTGRES_USER: vellumhub
  POSTGRES_PASSWORD: replace-with-a-strong-password
  POSTGRES_AUTH_USER: auth_owner
  POSTGRES_AUTH_PASSWORD: replace-with-a-different-strong-password
  VELLUM_INTERNAL_PROVISION_KEY: replace-with-at-least-32-random-characters

  # Each value is a full JAAS login stanza issued to ONE service; no shared passwords.
  # Never apply these placeholders in production; inject from the secret manager.
  KAFKA_CATALOG_JAAS: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="catalog_service" password="replace-me";'
  KAFKA_USER_JAAS: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="user_service" password="replace-me";'
  KAFKA_ENGAGEMENT_JAAS: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="engagement_service" password="replace-me";'
  KAFKA_RECOMMENDATION_JAAS: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="recommendation_service" password="replace-me";'
