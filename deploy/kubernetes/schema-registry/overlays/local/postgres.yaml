apiVersion: v1
kind: Service
metadata: {name: registry-postgres}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: registry-postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: registry-postgres}
spec:
  serviceName: registry-postgres
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: registry-postgres}}
  template:
    metadata: {labels: {app.kubernetes.io/name: registry-postgres}}
    spec:
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: registrydb}
            - {name: POSTGRES_USER, valueFrom: {secretKeyRef: {name: schema-registry-db, key: username}}}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: schema-registry-db, key: password}}}
          readinessProbe:
            exec: {command: [sh, -ec, "pg_isready -U \"$POSTGRES_USER\" -d registrydb"]}
            periodSeconds: 5
            failureThreshold: 12
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}
