apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway-service}
spec:
  replicas: 1
  template:
    spec:
      volumes:
        - {name: java-tmp, emptyDir: {sizeLimit: 256Mi}}
      containers:
        - name: gateway-service
          volumeMounts:
            - {name: java-tmp, mountPath: /tmp}
---
