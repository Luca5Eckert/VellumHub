# Fresh Kind install: same local infrastructure (guarded for parity), plus Avro routes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vellumhub
resources:
  - ../../base
  - infrastructure.yaml
  - databases.yaml
  - local-allow.yaml
patches:
  - path: local-patches.yaml
  - target: {group: apps, version: v1, kind: Deployment, name: catalog-service}
    path: catalog.json
  - target: {group: apps, version: v1, kind: Deployment, name: engagement-service}
    path: engagement.json
  - target: {group: apps, version: v1, kind: Deployment, name: recommendation-service}
    path: recommendation.json
images:
  # Load these exact CI-built images into kind, or replace with published SHA tags.
  - name: ghcr.io/luca5eckert/vellumhub-gateway
    newTag: REPLACE_WITH_GIT_SHA
  - name: ghcr.io/luca5eckert/vellumhub-auth
    newTag: REPLACE_WITH_GIT_SHA
  - name: ghcr.io/luca5eckert/vellumhub-user
    newTag: REPLACE_WITH_GIT_SHA
  - name: ghcr.io/luca5eckert/vellumhub-catalog
    newTag: REPLACE_WITH_GIT_SHA
  - name: ghcr.io/luca5eckert/vellumhub-engagement
    newTag: REPLACE_WITH_GIT_SHA
  - name: ghcr.io/luca5eckert/vellumhub-recommendation
    newTag: REPLACE_WITH_GIT_SHA
