# A NEW Kind install; Registry is applied and approved separately before this overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vellumhub
resources:
  - ../local
patches:
  - target: {group: apps, version: v1, kind: Deployment, name: catalog-service}
    path: catalog.json
  - target: {group: apps, version: v1, kind: Deployment, name: engagement-service}
    path: engagement.json
  - target: {group: apps, version: v1, kind: Deployment, name: recommendation-service}
    path: recommendation.json
