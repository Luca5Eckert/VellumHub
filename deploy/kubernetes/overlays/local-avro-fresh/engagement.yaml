apiVersion: apps/v1
kind: Deployment
metadata: {name: engagement-service}
spec:
  template:
    spec:
      containers:
        - name: engagement-service
          env:
            - {name: BOOK_AVRO_CONSUMER_ENABLED, value: "true"}
            - {name: READING_PROGRESS_AVRO_CONSUMER_ENABLED, value: "true"}
            - {name: ENGAGEMENT_RATINGS_WIRE_FORMAT, value: avro}
            - {name: ENGAGEMENT_REACTIONS_WIRE_FORMAT, value: avro}
            - {name: BOOK_AVRO_REGISTRY_URL, value: "http://schema-registry:8080/apis/ccompat/v7"}
            - {name: READING_PROGRESS_AVRO_REGISTRY_URL, value: "http://schema-registry:8080/apis/ccompat/v7"}
            - {name: ENGAGEMENT_AVRO_REGISTRY_URL, value: "http://schema-registry:8080/apis/ccompat/v7"}
