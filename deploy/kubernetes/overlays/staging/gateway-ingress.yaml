apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-service
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: null
spec:
  ingressClassName: traefik
  tls:
    - hosts: [api.vellumhub.test]
      secretName: vellumhub-staging-tls
  rules:
    - host: api.vellumhub.test
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend: {service: {name: gateway-service, port: {name: http}}}
