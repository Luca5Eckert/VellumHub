apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vellumhub
resources: [../../../overlays/local, ../../../schema-registry/overlays/local]
patches:
  - target: {group: apps, version: v1, kind: Deployment, name: catalog-service}
    patch: |-
     - op: add
       path: /spec/template/spec/containers/0/env/-
       value: {name: BOOK_EVENTS_WIRE_FORMAT, value: "json"}
     - op: add
       path: /spec/template/spec/containers/0/env/-
       value: {name: BOOK_AVRO_REGISTRY_URL, value: "http://schema-registry:8080/apis/ccompat/v7"}
  - target: {group: apps, version: v1, kind: Deployment, name: recommendation-service}
    patch: |-
     - op: add
       path: /spec/template/spec/containers/0/env/-
       value: {name: BOOK_AVRO_CONSUMER_ENABLED, value: "true"}
     - op: add
       path: /spec/template/spec/containers/0/env/-
       value: {name: BOOK_AVRO_REGISTRY_URL, value: "http://schema-registry:8080/apis/ccompat/v7"}
  - target: {group: apps, version: v1, kind: Deployment, name: engagement-service}
    patch: |-
     - op: add
       path: /spec/template/spec/containers/0/env/-
       value: {name: BOOK_AVRO_CONSUMER_ENABLED, value: "true"}
     - op: add
       path: /spec/template/spec/containers/0/env/-
       value: {name: BOOK_AVRO_REGISTRY_URL, value: "http://schema-registry:8080/apis/ccompat/v7"}
