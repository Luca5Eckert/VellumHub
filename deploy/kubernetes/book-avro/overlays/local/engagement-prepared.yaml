apiVersion: apps/v1
kind: Deployment
metadata: {name: engagement-service}
spec:
  template:
    spec:
      containers:
        - name: engagement-service
          env:
            - {name: BOOK_AVRO_CONSUMER_ENABLED, value: "false"}
            - {name: BOOK_AVRO_REGISTRY_URL, value: "http://schema-registry:8080/apis/ccompat/v7"}
