apiVersion: apps/v1
kind: Deployment
metadata: {name: catalog-service}
spec:
  template:
    spec:
      containers:
        - name: catalog-service
          env:
            - {name: BOOK_EVENTS_WIRE_FORMAT, value: json}
            - {name: BOOK_AVRO_REGISTRY_URL, value: "http://schema-registry:8080/apis/ccompat/v7"}
