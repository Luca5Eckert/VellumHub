apiVersion: apps/v1
kind: Deployment
metadata: {name: catalog-service}
spec:
  template:
    spec:
      containers:
        - name: catalog-service
          env:
            - {name: BOOK_AVRO_REGISTRY_URL, valueFrom: {secretKeyRef: {name: book-avro-registry, key: url}}}
            - {name: BOOK_AVRO_PRODUCER_ENABLED, value: "false"}
            - {name: BOOK_EVENTS_WIRE_FORMAT, value: json}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: recommendation-service}
spec:
  template:
    spec:
      containers:
        - name: recommendation-service
          env:
            - {name: BOOK_AVRO_REGISTRY_URL, valueFrom: {secretKeyRef: {name: book-avro-registry, key: url}}}
            - {name: BOOK_AVRO_CONSUMER_ENABLED, value: "false"}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: engagement-service}
spec:
  template:
    spec:
      containers:
        - name: engagement-service
          env:
            - {name: BOOK_AVRO_REGISTRY_URL, valueFrom: {secretKeyRef: {name: book-avro-registry, key: url}}}
            - {name: BOOK_AVRO_CONSUMER_ENABLED, value: "false"}
